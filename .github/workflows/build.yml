name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        default: v0.1.0

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm run dist
        env:
          # No Apple signing identity in CI: produce unsigned dmgs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: qqpet-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android-signing:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing is not configured; publishing desktop installers only."
          fi

  android:
    needs: android-signing
    if: needs.android-signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck && npm run build:android-web
      - run: |
          : "${KEYSTORE_BASE64:?set the ANDROID_KEYSTORE_BASE64 secret}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mkdir dist && mv android/app/build/outputs/apk/release/app-release.apk "dist/QQPet-${RELEASE_TAG#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: qqpet-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    if: always() && needs.build.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, to find the previous release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Commit subjects since the previous tag, grouped by gitmoji; docs, CI and refactors are left out.
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$RELEASE_TAG
          section() {
            local lines
            lines=$(git log --no-merges --format=%s "$range" | grep -E "^($2) " | sed -E 's/^:[a-z_]+: //; s/^\(([^)]+)\): /**\1**：/; s/^/- /' || true)
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section 新功能 ':sparkles:'
            section 修复 ':bug:|:ambulance:'
            section 优化 ':zap:|:lipstick:'
          } > notes.md
          cat notes.md
      - name: Android availability
        if: needs.android.result == 'skipped'
        run: printf '\nAndroid APK is not included because release signing is not configured.\n' >> notes.md
      - name: Checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: artifacts/*
