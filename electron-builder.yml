appId: io.github.qqpet
productName: QQPet
directories:
  output: dist
  buildResources: build
files:
  - out/**
extraResources:
  - from: resources
    to: .
    filter:
      - pet/**
      - icons/**
asar: true
# Releases are uploaded by the GitHub workflow; no auto-update feed.
publish: []

win:
  target: [zip]
  artifactName: QQPet-${version}-win-${arch}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.games

linux:
  target: [AppImage, deb]
  category: Game
  maintainer: qqpet
